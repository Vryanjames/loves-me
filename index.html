<title>Loves Me, Loves Me Not</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap">
<style>
  /* Layout: one centered pixel canvas (180x240, integer-scaled) with a small control strip under it. */
  :root {
    --bg: #05060f;
    --fg: #e8eaff;
    --muted: #8e94d8;
    --pink: #ff8fc0;
    --blue: #a9bcff;
    --edge: #1c2278;
    --btn: #141a5e;
    --btn-hover: #1f2a8c;
    --pixel: "Press Start 2P", ui-monospace, "Courier New", monospace;
    color-scheme: dark;
  }
  html, body { height: 100%; }
  body {
    margin: 0;
    box-sizing: border-box;
    background: var(--bg);
    color: var(--fg);
    font-family: var(--pixel);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 14px;
    padding-block: 12px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  canvas {
    display: block;
    image-rendering: -moz-crisp-edges;
    image-rendering: crisp-edges;
    image-rendering: pixelated;
    background: #000;
    box-shadow: 0 0 0 3px #12143a, 0 0 60px rgba(120, 100, 255, 0.28);
    cursor: pointer;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  canvas:focus-visible { outline: 3px solid var(--pink); outline-offset: 8px; }
  .hud {
    position: absolute;
    width: 1px;
    height: 1px;
    overflow: hidden;
    clip-path: inset(50%);
    white-space: nowrap;
  }
  .hud p { margin: 0; line-height: 1.7; }
  #status { font-size: 10px; color: var(--fg); min-height: 2.4em; }
  .keys { font-size: 8px; color: var(--muted); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
  button {
    font: inherit;
    font-size: 8px;
    color: var(--fg);
    background: var(--btn);
    border: 0;
    padding: 9px 12px 8px;
    box-shadow: inset -2px -2px 0 rgba(0, 0, 0, 0.45), inset 2px 2px 0 rgba(255, 255, 255, 0.18);
    cursor: pointer;
  }
  button:hover { background: var(--btn-hover); }
  button:active { transform: translateY(1px); }
  button:focus-visible { outline: 3px solid var(--pink); outline-offset: 3px; }
</style>

<canvas id="c" tabindex="0" role="img" aria-label="A short pixel film: a daisy at night. Click to pluck a petal."></canvas>
<div class="hud"><p id="status" aria-live="polite"></p></div>

<script>
(() => {
  'use strict';

  const W = 180, H = 240, N = 11;           // N is odd, so the last petal is always "loves me"
  const HX0 = 90, HY0 = 104, STEM_BOT = 208;
  const R_DISK = 11, R0 = 10, PL = 34, PW = 7;
  const INTRO_SCENE = 4.2, INTRO_PLAY = 4.7; // seconds: scene fades in, then plucking is allowed
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const cvs = document.getElementById('c');
  const ctx = cvs.getContext('2d');
  cvs.width = W; cvs.height = H;
  const frame = ctx.createImageData(W, H);
  const fb = frame.data;
  const tmp = new Uint8ClampedArray(W * H * 4);

  // ---------- helpers ----------
  const BAYER = [[0, 8, 2, 10], [12, 4, 14, 6], [3, 11, 1, 9], [15, 7, 13, 5]];
  const bay = (x, y) => (BAYER[y & 3][x & 3] + 0.5) / 16;
  const bayT = new Float32Array(W * H);
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) bayT[y * W + x] = bay(x, y);
  const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
  const mix = (a, b, t) => [(a[0] + (b[0] - a[0]) * t) | 0, (a[1] + (b[1] - a[1]) * t) | 0, (a[2] + (b[2] - a[2]) * t) | 0];
  const rnd = (a, b) => a + Math.random() * (b - a);
  function rng(seed) {
    let a = seed;
    return () => {
      a |= 0; a = a + 0x6D2B79F5 | 0;
      let t = Math.imul(a ^ a >>> 15, 1 | a);
      t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function put(x, y, c) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) << 2;
    fb[i] = c[0]; fb[i + 1] = c[1]; fb[i + 2] = c[2]; fb[i + 3] = 255;
  }
  function blend(x, y, c, t) {
    if (x < 0 || y < 0 || x >= W || y >= H) return;
    const i = (y * W + x) << 2;
    fb[i] += (c[0] - fb[i]) * t; fb[i + 1] += (c[1] - fb[i + 1]) * t; fb[i + 2] += (c[2] - fb[i + 2]) * t;
  }
  function rect(x, y, w, h, c, a = 1) {
    for (let yy = 0; yy < h; yy++) for (let xx = 0; xx < w; xx++) {
      if (a < 1 && bay(x + xx, y + yy) >= a) continue;
      put(x + xx, y + yy, c);
    }
  }
  function pick3(tones, val, x, y) {
    const lv = clamp(val, 0, 1) * (tones.length - 1);
    const i = Math.floor(lv);
    const k = Math.min(tones.length - 1, i + ((lv - i) > bay(x, y) ? 1 : 0));
    return tones[k];
  }

  // ---------- static background layers (sky, hills, ground) ----------
  const MOON = { x: 146, y: 38, r: 11 };
  let skyData, hillData, groundData;
  function buildBackground() {
    const r = rng(7);
    const stops = [[0, [10, 14, 62]], [0.5, [34, 46, 140]], [1, [128, 82, 164]]];
    const grad = (t) => {
      for (let i = 1; i < stops.length; i++) {
        if (t <= stops[i][0]) {
          const [t0, c0] = stops[i - 1], [t1, c1] = stops[i];
          return mix(c0, c1, (t - t0) / (t1 - t0));
        }
      }
      return stops[stops.length - 1][1];
    };
    const BANDS = 9, HOR = 182;
    for (let y = 0; y < H; y++) {
      const v = Math.min(1, y / HOR) * BANDS;
      const i = Math.floor(v);
      for (let x = 0; x < W; x++) {
        const k = i + ((v - i) > bay(x, y) ? 1 : 0);
        put(x, y, grad(Math.min(k, BANDS) / BANDS));
      }
    }
    // moon halo
    for (let y = MOON.y - 26; y <= MOON.y + 26; y++) {
      for (let x = MOON.x - 26; x <= MOON.x + 26; x++) {
        const d = Math.hypot(x + 0.5 - MOON.x, y + 0.5 - MOON.y);
        if (d > MOON.r && d < 25) {
          const p = 0.7 * Math.pow(1 - (d - MOON.r) / (25 - MOON.r), 1.3);
          if (bay(x, y) < p) blend(x, y, [196, 202, 255], 0.34);
        }
      }
    }
    // moon
    const craters = [[-4, -3, 3], [4, 2, 2.2], [-2, 6, 2], [5, -5, 1.6]];
    for (let y = MOON.y - 12; y <= MOON.y + 12; y++) {
      for (let x = MOON.x - 12; x <= MOON.x + 12; x++) {
        const dx = x + 0.5 - MOON.x, dy = y + 0.5 - MOON.y;
        const d = Math.hypot(dx, dy);
        if (d > MOON.r) continue;
        let c = [242, 236, 180];
        if (d > MOON.r - 1.8 && bay(x, y) < 0.6) c = [222, 214, 156];
        for (const [cx, cy, cr] of craters) {
          if (Math.hypot(dx - cx, dy - cy) < cr) c = [214, 206, 148];
        }
        put(x, y, c);
      }
    }
    skyData = new Uint8ClampedArray(fb);

    // hills (transparent layer)
    fb.fill(0);
    for (let x = 0; x < W; x++) {
      const y1 = Math.round(176 + 9 * Math.sin(x * 0.035) + 5 * Math.sin(x * 0.09 + 1));
      for (let y = y1; y < H; y++) put(x, y, [28, 38, 108]);
      put(x, y1, bay(x, y1) < 0.5 ? [52, 64, 150] : [28, 38, 108]);
      put(x, y1 + 1, bay(x, y1 + 1) < 0.25 ? [46, 58, 142] : [28, 38, 108]);
      const y2 = Math.round(192 + 4 * Math.sin(x * 0.06 + 2));
      for (let y = y2; y < H; y++) put(x, y, [20, 52, 88]);
    }
    hillData = new Uint8ClampedArray(fb);

    // ground (transparent layer)
    fb.fill(0);
    for (let x = 0; x < W; x++) {
      const g0 = Math.round(203 + 2 * Math.sin(x * 0.08));
      for (let y = g0; y < H; y++) {
        const t = (y - g0) / (H - g0);
        put(x, y, bay(x, y) < t * 0.85 ? [18, 62, 38] : [30, 92, 46]);
      }
    }
    for (let i = 0; i < 180; i++) {
      const x = Math.floor(r() * W), y = 206 + Math.floor(r() * (H - 206));
      put(x, y, r() < 0.5 ? [62, 142, 66] : [20, 72, 40]);
    }
    groundData = new Uint8ClampedArray(fb);
  }
  buildBackground();

  function composeSky(sx) {
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        const xs = clamp(x - sx, 0, W - 1);
        const si = (row + xs) << 2, di = (row + x) << 2;
        fb[di] = skyData[si]; fb[di + 1] = skyData[si + 1]; fb[di + 2] = skyData[si + 2]; fb[di + 3] = 255;
      }
    }
  }
  function composeLayer(data, sx) {
    for (let y = 0; y < H; y++) {
      const row = y * W;
      for (let x = 0; x < W; x++) {
        const xs = clamp(x - sx, 0, W - 1);
        const si = (row + xs) << 2;
        if (data[si + 3] === 0) continue;
        const di = (row + x) << 2;
        fb[di] = data[si]; fb[di + 1] = data[si + 1]; fb[di + 2] = data[si + 2]; fb[di + 3] = 255;
      }
    }
  }
  function drawMist(t) {
    for (let y = 170; y < 206; y++) {
      const band = 1 - Math.abs(y - 189) / 19;
      if (band <= 0) continue;
      for (let x = 0; x < W; x++) {
        const dens = 0.22 * band * (0.5 + 0.5 * Math.sin(x * 0.045 + t * 0.12 + y * 0.12));
        if (bay(x, y) < dens) blend(x, y, [160, 140, 210], 0.36);
      }
    }
  }

  // ---------- stars and shooting star ----------
  const sr = rng(11);
  const stars = [];
  while (stars.length < 46) {
    const x = 3 + Math.floor(sr() * (W - 6)), y = 3 + Math.floor(sr() * 128);
    if (Math.hypot(x - MOON.x, y - MOON.y) < 24) continue;
    stars.push({ x, y, ph: sr() * 6.28, sp: 1.2 + sr() * 1.6, cross: sr() < 0.17 });
  }
  function drawStars(t, sx) {
    for (const s of stars) {
      const x = s.x + sx, y = s.y;
      const tw = reduce ? 0.8 : 0.5 + 0.5 * Math.sin(t * s.sp + s.ph);
      if (s.cross) {
        if (tw > 0.5) {
          put(x, y, [214, 226, 255]);
          const arm = [110, 142, 238];
          put(x - 1, y, arm); put(x + 1, y, arm); put(x, y - 1, arm); put(x, y + 1, arm);
          if (tw > 0.85) { put(x - 2, y, arm); put(x + 2, y, arm); put(x, y - 2, arm); put(x, y + 2, arm); }
        }
      } else if (tw > 0.22) {
        put(x, y, mix([60, 72, 168], [236, 240, 255], tw));
      }
    }
  }
  let shoot = null, nextShoot = 6;
  function drawShoot() {
    if (!shoot) return;
    for (let k = 0; k < 12; k++) {
      const t = k * 0.012;
      const x = Math.round(shoot.x - shoot.vx * t), y = Math.round(shoot.y - shoot.vy * t);
      const c = k === 0 ? [255, 255, 255] : mix([220, 230, 255], [90, 110, 240], k / 12);
      blend(x, y, c, k === 0 ? 1 : 1 - k / 13);
    }
  }

  // ---------- generic pixel raster for oriented shapes ----------
  function raster(ox, oy, ang, L, Wm, mulW, profile, shade) {
    const dx = Math.cos(ang), dy = Math.sin(ang);
    const R = L + Wm + 2;
    const x0 = Math.max(0, Math.floor(ox - R)), x1 = Math.min(W - 1, Math.ceil(ox + R));
    const y0 = Math.max(0, Math.floor(oy - R)), y1 = Math.min(H - 1, Math.ceil(oy + R));
    for (let y = y0; y <= y1; y++) {
      for (let x = x0; x <= x1; x++) {
        const rx = x + 0.5 - ox, ry = y + 0.5 - oy;
        const u = rx * dx + ry * dy;
        if (u < 0 || u > L) continue;
        const v = -rx * dy + ry * dx;
        const s = u / L;
        const hw = profile(s) * Wm * mulW;
        const av = Math.abs(v);
        if (av > hw) continue;
        put(x, y, shade(s, hw > 0 ? v / hw : 0, hw, av, x, y, L - u));
      }
    }
  }

  const P_EDGE = [138, 160, 230];
  const P_TONES = [[160, 182, 240], [214, 226, 254], [246, 249, 255]];
  const petalProfile = (s) => s < 0.6
    ? Math.pow(Math.sin((s / 0.6) * Math.PI / 2), 0.85)
    : Math.sqrt(Math.max(0, 1 - Math.pow((s - 0.6) / 0.4, 2)));
  function petalShade(s, n, hw, av, x, y, dEnd) {
    if (hw - av < 1.0 || dEnd < 1.0) return P_EDGE;
    let val = 0.22 + 0.8 * s - 0.3 * n * n;
    if (av < 0.55 && s > 0.15 && s < 0.85) val -= 0.14;
    return pick3(P_TONES, val, x, y);
  }

  const L_EDGE = [26, 88, 48], L_RIB = [30, 98, 52];
  const L_TONES = [[34, 110, 56], [62, 166, 74], [118, 214, 104]];
  const leafProfile = (s) => Math.pow(Math.sin(Math.PI * Math.pow(s, 0.85)), 0.8);
  function leafShade(s, n, hw, av, x, y, dEnd) {
    if (hw - av < 0.9 || dEnd < 0.9) return L_EDGE;
    if (av < 0.55) return L_RIB;
    return pick3(L_TONES, 0.45 + 0.35 * n + 0.15 * s, x, y);
  }

  // ---------- stem, leaves, glow, disk ----------
  const STEM_D = [30, 104, 50], STEM_M = [52, 160, 64], STEM_L = [104, 210, 96];
  function stemX(y, sw) {
    const f = (y - HY0) / (STEM_BOT - HY0);
    return Math.round(HX0 + 3 * Math.sin(f * Math.PI * 0.9) + sw * Math.pow(1 - f, 1.6));
  }
  function drawStem(sw, t) {
    for (let y = HY0; y <= STEM_BOT; y++) {
      const x = stemX(y, sw);
      put(x - 1, y, STEM_D); put(x, y, STEM_M); put(x + 1, y, STEM_L);
    }
    const lw = reduce ? 0 : Math.sin(t * 1.1) * 0.05;
    raster(stemX(168, sw), 168, -Math.PI + 0.5 + lw, 21, 5.2, 1, leafProfile, leafShade);
    raster(stemX(188, sw), 188, -0.5 - lw, 21, 5.2, 1, leafProfile, leafShade);
  }

  function drawGlow(hx, hy, t) {
    const fin = heartAmt;
    const I = (reduce ? 0.4 : 0.38 + 0.08 * Math.sin(t * 2)) + fin * 0.32 + (fin > 0 && !reduce ? 0.08 * Math.sin(t * 7) : 0);
    const col = mix([255, 176, 84], [255, 120, 180], fin);
    const R = 32;
    for (let y = hy - R; y <= hy + R; y++) {
      for (let x = hx - R; x <= hx + R; x++) {
        const d = Math.hypot(x + 0.5 - hx, y + 0.5 - hy);
        if (d < R_DISK - 1 || d > R) continue;
        const f = 1 - (d - R_DISK + 1) / (R - R_DISK + 1);
        if (bay(x, y) < I * f * f) blend(x, y, col, 0.4);
      }
    }
  }

  const D_TONES = [[190, 92, 20], [236, 146, 34], [252, 196, 70]];
  const HEART_DISK = [
    '..XXX.XXX..',
    '.XXXXXXXXX.',
    'XXXXXXXXXXX',
    'XXXXXXXXXXX',
    'XXXXXXXXXXX',
    '.XXXXXXXXX.',
    '..XXXXXXX..',
    '...XXXXX...',
    '....XXX....',
    '.....X.....'
  ];
  const hd = (cx, cy) => cy >= 0 && cy < HEART_DISK.length && cx >= 0 && cx < 11 && HEART_DISK[cy][cx] === 'X';
  function drawDisk(hx, hy, t) {
    for (let y = hy - 12; y <= hy + 12; y++) {
      for (let x = hx - 12; x <= hx + 12; x++) {
        const dx = x + 0.5 - hx, dy = y + 0.5 - hy;
        const d = Math.hypot(dx, dy);
        if (d > R_DISK) continue;
        if (d > R_DISK - 1.1) { put(x, y, [150, 72, 22]); continue; }
        const val = 0.5 + (dx * 0.55 - dy * 0.55) / R_DISK * 0.5 - 0.2 * (d / R_DISK);
        let c = pick3(D_TONES, val, x, y);
        const lx = Math.floor(dx), ly = Math.floor(dy);
        const row = ly % 2 === 0;
        const col = ((lx + (((ly >> 1) & 1) ? 1 : 0)) % 3 + 3) % 3 === 0;
        if (row && col) c = d < 4 ? [255, 226, 120] : mix(c, [255, 220, 110], 0.6);
        put(x, y, c);
      }
    }
    if (heartAmt > 0) {
      const pulse = reduce ? 0.3 : 0.5 + 0.5 * Math.sin(t * 7);
      const main = mix([255, 96, 148], [255, 150, 190], pulse * 0.7);
      for (let cy = 0; cy < HEART_DISK.length; cy++) {
        for (let cx = 0; cx < 11; cx++) {
          if (!hd(cx, cy)) continue;
          const px = hx - 5 + cx, py = hy - 5 + cy;
          if (bay(px, py) >= heartAmt) continue;
          const rim = !hd(cx - 1, cy) || !hd(cx + 1, cy) || !hd(cx, cy - 1) || !hd(cx, cy + 1);
          let c = rim ? [196, 52, 108] : main;
          if ((cx === 2 && cy === 2) || (cx === 3 && cy === 2) || (cx === 2 && cy === 3)) c = [255, 206, 226];
          put(px, py, c);
        }
      }
    }
  }

  // ---------- grass ----------
  const gr = rng(23);
  const GRASS_COLS = [[58, 150, 62], [38, 116, 52], [96, 186, 74], [26, 90, 46]];
  const grass = [];
  for (let i = 0; i < 150; i++) {
    const y = 202 + Math.floor(gr() * 36);
    grass.push({
      x: Math.floor(gr() * W), y,
      h: 3 + Math.floor((y - 200) / 6 + gr() * 3),
      col: GRASS_COLS[Math.floor(gr() * GRASS_COLS.length)],
      ph: gr() * 6.28
    });
  }
  grass.sort((a, b) => a.y - b.y);
  function drawGrass(t) {
    for (const g of grass) {
      for (let k = 0; k < 2; k++) {
        const h = k === 0 ? g.h : Math.max(2, g.h - 2);
        for (let j = 0; j < h; j++) {
          const sx = reduce ? 0 : Math.round(Math.sin(t * 1.7 + g.ph + k) * (j / h) * 1.6);
          put(g.x + k + sx, g.y - j, j === h - 1 ? [140, 220, 110] : g.col);
        }
      }
    }
  }

  // ---------- fireflies ----------
  const fr = rng(41);
  const flies = [];
  for (let i = 0; i < 16; i++) {
    flies.push({ bx: 10 + fr() * (W - 20), by: 140 + fr() * 76, ph: fr() * 6.28, sp: 0.35 + fr() * 0.5 });
  }
  function drawFlies(t) {
    for (const f of flies) {
      const x = Math.round(f.bx + (reduce ? 0 : Math.sin(t * f.sp + f.ph) * 14));
      const y = Math.round(f.by + (reduce ? 0 : Math.cos(t * f.sp * 0.8 + f.ph) * 8));
      const b = 0.5 + 0.5 * Math.sin(t * 1.7 + f.ph * 3);
      if (b < 0.3) continue;
      const glow = [200, 255, 120];
      blend(x - 1, y, glow, 0.5 * b); blend(x + 1, y, glow, 0.5 * b);
      blend(x, y - 1, glow, 0.5 * b); blend(x, y + 1, glow, 0.5 * b);
      if (b > 0.75) {
        blend(x - 2, y, glow, 0.25); blend(x + 2, y, glow, 0.25);
        blend(x, y - 2, glow, 0.25); blend(x, y + 2, glow, 0.25);
      }
      put(x, y, [236, 255, 160]);
    }
  }

  // ---------- hearts and sparks ----------
  const HEART_BIG = ['.xx.xx.', 'xhhxxxx', 'xhxxxxx', '.xxxxx.', '..xxx..', '...x...'];
  const HEART_SMALL = ['.x.x.', 'xhxxx', 'xxxxx', '.xxx.', '..x..'];
  const HEART_COLS = [
    { m: [255, 112, 160], l: [255, 182, 208] },
    { m: [240, 72, 112], l: [255, 146, 168] },
    { m: [255, 143, 192], l: [255, 208, 228] }
  ];
  function drawHeart(x, y, kind, pal, a = 1) {
    const sp = kind === 0 ? HEART_SMALL : HEART_BIG;
    const ox = Math.round(x) - (sp[0].length >> 1), oy = Math.round(y) - (sp.length >> 1);
    for (let r = 0; r < sp.length; r++) {
      for (let c = 0; c < sp[r].length; c++) {
        const ch = sp[r][c];
        if (ch === '.') continue;
        if (a < 1 && bay(ox + c, oy + r) >= a) continue;
        put(ox + c, oy + r, ch === 'h' ? pal.l : pal.m);
      }
    }
  }
  function drawSparks() {
    for (const s of sparks) {
      const k = s.life / s.max;
      if (k > 0.65 && Math.floor(s.life * 24) % 2 === 0) continue;
      const x = Math.round(s.x), y = Math.round(s.y);
      if (k < 0.25) {
        put(x, y, s.col); put(x + 1, y, s.col); put(x, y + 1, s.col); put(x + 1, y + 1, s.col);
      } else {
        put(x, y, s.col);
      }
    }
  }

  // ---------- pixel text ----------
  const FONT = {
    L: ['X....', 'X....', 'X....', 'X....', 'X....', 'X....', 'XXXXX'],
    O: ['.XXX.', 'X...X', 'X...X', 'X...X', 'X...X', 'X...X', '.XXX.'],
    V: ['X...X', 'X...X', 'X...X', 'X...X', 'X...X', '.X.X.', '..X..'],
    E: ['XXXXX', 'X....', 'X....', 'XXXX.', 'X....', 'X....', 'XXXXX'],
    S: ['.XXXX', 'X....', 'X....', '.XXX.', '....X', '....X', 'XXXX.'],
    M: ['X...X', 'XX.XX', 'X.X.X', 'X.X.X', 'X...X', 'X...X', 'X...X'],
    N: ['X...X', 'XX..X', 'X.X.X', 'X.X.X', 'X.X.X', 'X..XX', 'X...X'],
    T: ['XXXXX', '..X..', '..X..', '..X..', '..X..', '..X..', '..X..'],
    A: ['.XXX.', 'X...X', 'X...X', 'XXXXX', 'X...X', 'X...X', 'X...X'],
    P: ['XXXX.', 'X...X', 'X...X', 'XXXX.', 'X....', 'X....', 'X....'],
    I: ['XXXXX', '..X..', '..X..', '..X..', '..X..', '..X..', 'XXXXX'],
    X: ['X...X', 'X...X', '.X.X.', '..X..', '.X.X.', 'X...X', 'X...X'],
    F: ['XXXXX', 'X....', 'X....', 'XXXX.', 'X....', 'X....', 'X....'],
    H: ['X...X', 'X...X', 'X...X', 'XXXXX', 'X...X', 'X...X', 'X...X'],
    D: ['XXXX.', 'X...X', 'X...X', 'X...X', 'X...X', 'X...X', 'XXXX.'],
    '?': ['.XXX.', 'X...X', '....X', '...X.', '..X..', '.....', '..X..'],
    ',': ['.....', '.....', '.....', '.....', '..XX.', '..XX.', '.X...']
  };
  const textWidth = (str, s) => str.length * 6 * s - s;
  function drawText(str, y, s, col, a = 1, shadow = true) {
    const x0 = Math.round((W - textWidth(str, s)) / 2);
    for (let pass = shadow ? 0 : 1; pass < 2; pass++) {
      const off = pass === 0 ? 1 : 0;
      const c = pass === 0 ? [10, 12, 50] : col;
      for (let i = 0; i < str.length; i++) {
        const g = FONT[str[i]];
        if (!g) continue;
        for (let r = 0; r < 7; r++) {
          for (let k = 0; k < 5; k++) {
            if (g[r][k] === 'X') rect(x0 + i * 6 * s + k * s + off, y + r * s + off, s, s, c, a);
          }
        }
      }
    }
  }

  // ---------- sound (WebAudio, starts on first tap) ----------
  let audio = null, soundOn = true;
  function ac() {
    if (!audio) {
      try { audio = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { audio = null; }
    }
    if (audio && audio.state === 'suspended') audio.resume().catch(() => {});
    return audio;
  }
  function tone(freq, dur, type, vol, delay) {
    if (!soundOn) return;
    const a = ac();
    if (!a) return;
    try {
      const t0 = a.currentTime + (delay || 0);
      const o = a.createOscillator(), g = a.createGain();
      o.type = type || 'sine';
      o.frequency.setValueAtTime(freq, t0);
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol || 0.07, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      o.connect(g); g.connect(a.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    } catch (e) { /* ignore audio failures */ }
  }
  const SCALE = [523.25, 587.33, 659.25, 783.99, 880.0];

  // ---------- game state ----------
  const PINK = [255, 143, 192], BLUE = [169, 188, 255], NEUTRAL = [222, 228, 255];
  let petals = [], hearts = [], sparks = [];
  let plucked = 0, finished = false, finishedAt = 0, heartAmt = 0, spawnT = 0;
  let T = 0, introT = 100, barH = 14, vigK = 0.55, shake = 0, flash = 0; // introT starts past the title card, so the film opens straight on the flower
  let msg = '', msgCol = NEUTRAL, msgT = 0;
  let head = { x: HX0, y: HY0 };

  const statusEl = document.getElementById('status');
  function updateStatus() {
    const left = petals.filter(p => p.state === 'idle').length;
    if (finished) {
      statusEl.textContent = (plucked % 2 === 1 ? 'LOVES ME' : 'LOVES ME NOT') + ' · THE END';
    } else {
      statusEl.textContent = (plucked ? msg + ' · ' : '') + left + ' PETAL' + (left === 1 ? '' : 'S') + ' LEFT';
    }
  }
  function setMsg(text, col) { msg = text; msgCol = col; msgT = 0; }

  function reset() {
    petals = [];
    for (let i = 0; i < N; i++) {
      petals.push({
        i, a: -Math.PI / 2 + i * 2 * Math.PI / N + rnd(-0.04, 0.04),
        len: PL + rnd(-2.5, 2.5), w: PW + rnd(-0.6, 0.5),
        state: 'idle', ox: 0, oy: 0, curA: 0,
        x: 0, y: 0, ang: 0, vx: 0, vy: 0, spin: 0, ph: 0, age: 0, landY: 0, mulW: 1
      });
    }
    hearts = []; sparks = [];
    plucked = 0; finished = false; heartAmt = 0; spawnT = 0; flash = 0;
    setMsg('LOVES ME?', NEUTRAL);
    updateStatus();
  }

  function release(p) {
    const a = p.curA;
    p.state = 'fall';
    p.x = p.ox + Math.cos(a) * p.len / 2;
    p.y = p.oy + Math.sin(a) * p.len / 2;
    p.ang = a;
    p.vx = Math.cos(a) * 22 + rnd(-10, 10);
    p.vy = -28 + Math.sin(a) * 10 + rnd(-6, 6);
    p.spin = rnd(-3, 3);
    p.ph = rnd(0, 6.28);
    p.age = 0;
    p.landY = rnd(210, 232);
    p.mulW = 1;
  }

  function burst() {
    const n = 18;
    for (let i = 0; i < n; i++) {
      const a = (i / n) * Math.PI * 2 + rnd(-0.15, 0.15), sp = rnd(36, 70);
      hearts.push({
        x: head.x, y: head.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
        life: 0, max: rnd(3.4, 5.2), kind: Math.random() < 0.4 ? 0 : 1,
        pal: HEART_COLS[Math.floor(Math.random() * HEART_COLS.length)], ph: rnd(0, 6.28)
      });
    }
  }

  function skipIntro() { if (introT < INTRO_SCENE) introT = INTRO_SCENE; }

  function pluck() {
    ac();
    if (introT < INTRO_PLAY) { skipIntro(); return; }
    if (finished) {
      if (T - finishedAt > 2.0) reset();
      return;
    }
    const idle = petals.filter(p => p.state === 'idle');
    if (!idle.length) return;
    const p = idle[Math.floor(Math.random() * idle.length)];
    plucked++;
    const loves = plucked % 2 === 1;
    release(p);
    setMsg(loves ? 'LOVES ME' : 'LOVES ME NOT', loves ? PINK : BLUE);
    // dust sparks from the plucked petal
    const px = p.x, py = p.y;
    for (let i = 0; i < 12; i++) {
      sparks.push({
        x: px, y: py, vx: rnd(-45, 45), vy: rnd(-55, 10), life: 0, max: rnd(0.5, 0.95),
        col: Math.random() < 0.5 ? (loves ? PINK : BLUE) : [255, 255, 255]
      });
    }
    if (!reduce) shake = 0.14;
    const note = SCALE[plucked % SCALE.length];
    if (loves) tone(note, 0.5, 'triangle', 0.08); else tone(note * 0.5, 0.55, 'sine', 0.08);
    if (plucked === N) {
      finished = true; finishedAt = T; burst(); flash = 1;
      [523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, 1.6, 'sine', 0.06, 0.15 + i * 0.13));
    }
    updateStatus();
  }

  // ---------- update ----------
  function update(dt) {
    T += dt; introT += dt;
    if (introT < INTRO_SCENE + 0.9) msgT = 0; else msgT += dt;
    const barTarget = introT < INTRO_SCENE ? 0 : (finished && T - finishedAt > 0.5 ? 24 : 14);
    barH += (barTarget - barH) * Math.min(1, dt * 2.5);
    vigK += ((finished ? 0.8 : 0.55) - vigK) * Math.min(1, dt * 1.5);
    shake = Math.max(0, shake - dt);
    flash = Math.max(0, flash - dt * 1.6);

    for (const p of petals) {
      if (p.state !== 'fall') continue;
      p.age += dt;
      p.vy = Math.min(p.vy + 55 * dt, 34);
      p.vx -= p.vx * 0.8 * dt;
      p.x += (p.vx + 12 * Math.sin(p.age * 4 + p.ph)) * dt;
      p.y += p.vy * dt;
      p.x = clamp(p.x, 6, W - 6);
      p.ang += p.spin * dt;
      p.mulW = 0.4 + 0.6 * Math.abs(Math.cos(p.age * 3.2 + p.ph));
      if (p.y >= p.landY) {
        p.y = p.landY; p.state = 'land';
        p.ang = (Math.random() < 0.5 ? 0 : Math.PI) + rnd(-0.25, 0.25);
        p.mulW = 0.3;
      }
    }
    for (const s of sparks) {
      s.life += dt; s.vy += 90 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    }
    sparks = sparks.filter(s => s.life < s.max);

    if (finished) {
      heartAmt = Math.min(1, heartAmt + dt * 1.8);
      spawnT -= dt;
      if (spawnT <= 0) {
        spawnT = 0.28;
        hearts.push({
          x: head.x + rnd(-6, 6), y: head.y + rnd(-6, 4), vx: rnd(-10, 10), vy: rnd(-30, -18),
          life: 0, max: rnd(3.2, 4.6), kind: Math.random() < 0.5 ? 0 : 1,
          pal: HEART_COLS[Math.floor(Math.random() * HEART_COLS.length)], ph: rnd(0, 6.28)
        });
      }
    }
    const drag = Math.exp(-1.8 * dt);
    for (const h of hearts) {
      h.life += dt;
      h.vx *= drag; h.vy = h.vy * drag - 12 * dt;
      h.x += (h.vx + Math.sin(T * 2 + h.ph) * 6) * dt;
      h.y += h.vy * dt;
    }
    hearts = hearts.filter(h => h.life < h.max && h.y > -8);

    if (!reduce) {
      if (!shoot && introT > INTRO_SCENE + 1 && T > nextShoot) {
        shoot = { x: rnd(100, 175), y: rnd(26, 60), vx: -rnd(95, 125), vy: rnd(45, 60), life: 0 };
      }
      if (shoot) {
        shoot.life += dt; shoot.x += shoot.vx * dt; shoot.y += shoot.vy * dt;
        if (shoot.life > 0.9) { shoot = null; nextShoot = T + rnd(5, 9); }
      }
    }
  }

  // ---------- vignette ----------
  const vig = new Float32Array(W * H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const nx = (x + 0.5 - W / 2) / (W / 2), ny = (y + 0.5 - H / 2) / (H / 2);
      const d = Math.hypot(nx * 0.95, ny * 0.8);
      const v = clamp((d - 0.5) / 0.75, 0, 1);
      vig[y * W + x] = v * v;
    }
  }

  // ---------- post-processing: shake, vignette, fade, grain, flash ----------
  function post(sceneFade) {
    if (shake > 0) {
      const sx = Math.round(rnd(-1, 1)), sy = Math.round(rnd(-1, 1));
      if (sx || sy) {
        tmp.set(fb);
        for (let y = 0; y < H; y++) {
          const syy = clamp(y - sy, 0, H - 1);
          for (let x = 0; x < W; x++) {
            const sxx = clamp(x - sx, 0, W - 1);
            const si = (syy * W + sxx) << 2, di = (y * W + x) << 2;
            fb[di] = tmp[si]; fb[di + 1] = tmp[si + 1]; fb[di + 2] = tmp[si + 2];
          }
        }
      }
    }
    const f = flash * 90;
    for (let p = 0; p < W * H; p++) {
      const i = p << 2;
      if (sceneFade < 1 && bayT[p] >= sceneFade) { fb[i] = 0; fb[i + 1] = 0; fb[i + 2] = 0; continue; }
      const q = (1 - vigK * vig[p]) * 8;
      const k = Math.floor(q);
      const m = (k + ((q - k) > bayT[p] ? 1 : 0)) / 8;
      fb[i] = fb[i] * m + f;
      fb[i + 1] = fb[i + 1] * m + f * 0.6;
      fb[i + 2] = fb[i + 2] * m + f * 0.85;
    }
    if (!reduce) {
      for (let n = 0; n < 320; n++) {
        const i = Math.floor(Math.random() * W * H) << 2;
        const d = (Math.random() < 0.5 ? -1 : 1) * (8 + Math.random() * 14);
        fb[i] += d; fb[i + 1] += d; fb[i + 2] += d;
      }
    }
  }

  // ---------- render ----------
  function renderIntro() {
    for (let i = 0; i < fb.length; i += 4) { fb[i] = 0; fb[i + 1] = 0; fb[i + 2] = 0; fb[i + 3] = 255; }
    const t = introT, out = clamp(1 - (t - 3.3) / 0.7, 0, 1);
    const a1 = clamp((t - 0.5) / 0.6, 0, 1) * out;
    const a2 = clamp((t - 1.1) / 0.6, 0, 1) * out;
    const a3 = clamp((t - 1.7) / 0.6, 0, 1) * out;
    const a4 = clamp((t - 2.3) / 0.6, 0, 1) * out;
    if (a1 > 0) drawText('A PIXEL FILM', 86, 1, [140, 148, 214], a1, false);
    if (a2 > 0) drawText('LOVES ME,', 100, 2, PINK, a2);
    if (a3 > 0) drawText('LOVES ME NOT', 118, 2, BLUE, a3);
    if (a4 > 0) drawHeart(90, 152, 1, HEART_COLS[0], a4);
    ctx.putImageData(frame, 0, 0);
  }

  function render() {
    if (introT < INTRO_SCENE) { renderIntro(); return; }
    const sceneFade = clamp((introT - INTRO_SCENE) / 1.3, 0, 1);
    const camX = reduce ? 0 : Math.sin(T * 0.25) * 1.5;
    const sw = reduce ? 0 : Math.sin(T * 0.9) * 1.5;
    const hx = HX0 + Math.round(sw), hy = HY0;
    head = { x: hx, y: hy };

    composeSky(Math.round(-camX * 2));
    drawStars(T, Math.round(-camX * 2));
    drawShoot();
    composeLayer(hillData, Math.round(-camX));
    drawMist(reduce ? 0 : T);
    composeLayer(groundData, 0);

    drawStem(sw, T);
    for (const p of petals) {
      if (p.state !== 'land') continue;
      const L = p.len * 0.85, dx = Math.cos(p.ang), dy = Math.sin(p.ang);
      raster(p.x - dx * L / 2, p.y - dy * L / 2, p.ang, L, p.w, p.mulW, petalProfile, petalShade);
    }
    drawGlow(hx, hy, T);
    for (const p of petals) {
      if (p.state !== 'idle') continue;
      const a = p.a + (reduce ? 0 : 0.025 * Math.sin(T * 1.5 + p.i * 1.7));
      p.curA = a;
      p.ox = hx + Math.cos(a) * R0;
      p.oy = hy + Math.sin(a) * R0;
      raster(p.ox, p.oy, a, p.len, p.w, 1, petalProfile, petalShade);
    }
    drawDisk(hx, hy, T);
    for (const p of petals) {
      if (p.state !== 'fall') continue;
      const dx = Math.cos(p.ang), dy = Math.sin(p.ang);
      raster(p.x - dx * p.len / 2, p.y - dy * p.len / 2, p.ang, p.len, p.w, p.mulW, petalProfile, petalShade);
    }
    drawGrass(T);
    drawFlies(T);
    drawSparks();
    for (const h of hearts) {
      if (h.life > h.max - 0.8 && Math.floor(h.life * 14) % 2 === 0) continue;
      drawHeart(h.x, h.y, h.kind, h.pal);
    }

    post(sceneFade);

    // letterbox bars
    const bh = Math.round(barH);
    for (let y = 0; y < bh; y++) {
      for (let x = 0; x < W; x++) {
        let i = (y * W + x) << 2; fb[i] = fb[i + 1] = fb[i + 2] = 0;
        i = ((H - 1 - y) * W + x) << 2; fb[i] = fb[i + 1] = fb[i + 2] = 0;
      }
    }

    // title text inside the frame
    if (sceneFade > 0.3) {
      const s = textWidth(msg, 3) <= W - 16 ? 3 : 2;
      const bounce = msgT < 0.22 ? -Math.round(Math.pow(1 - msgT / 0.22, 2) * 8) : 0;
      drawText(msg, bh + 7 + bounce, s, msgCol, clamp((sceneFade - 0.3) / 0.7, 0, 1));
    }
    // "THE END" in the bottom bar
    if (finished && bh >= 20) {
      const a = clamp((T - finishedAt - 2.2) / 1.0, 0, 1);
      if (a > 0) drawText('THE END', H - bh + Math.floor((bh - 14) / 2), 2, [230, 232, 255], a, false);
    }

    ctx.putImageData(frame, 0, 0);
  }

  // ---------- sizing ----------
  const hud = document.querySelector('.hud');
  function fit() {
    const availW = document.documentElement.clientWidth - 32;
    const availH = window.innerHeight - 40;
    let scale = Math.floor(Math.min(availW / W, availH / H));
    if (scale < 2 && availW >= W * 2) scale = 2;
    if (scale < 1) scale = 1;
    cvs.style.width = W * scale + 'px';
    cvs.style.height = H * scale + 'px';
  }
  window.addEventListener('resize', fit);
  if (window.ResizeObserver) new ResizeObserver(fit).observe(document.documentElement);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);

  // ---------- input ----------
  cvs.addEventListener('pointerdown', (e) => { e.preventDefault(); pluck(); });
  window.addEventListener('keydown', (e) => {
    if (e.repeat) return;
    if (e.key === ' ' || e.key === 'Enter') {
      if (e.target && e.target.tagName === 'BUTTON') return;
      e.preventDefault();
      pluck();
    } else if (e.key === 'r' || e.key === 'R') {
      ac(); skipIntro(); reset();
    } else if (e.key === 'm' || e.key === 'M') {
      soundOn = !soundOn;
    }
  });

  // ---------- go ----------
  reset();
  fit();
  let last = performance.now();
  function loop(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    render();
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
